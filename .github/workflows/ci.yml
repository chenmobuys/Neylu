name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build and test (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate shell scripts
        run: bash -n build.sh test-history.sh scripts/sign-and-notarize.sh
      - name: Release tooling tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: History tests
        run: ./test-history.sh
      - name: Build
        run: ./build.sh
      - name: Runtime smoke test
        run: build/Neylu.app/Contents/MacOS/Neylu --self-test
      - name: Verify bundle
        run: |
          codesign --verify --strict build/Neylu.app
          plutil -lint build/Neylu.app/Contents/Info.plist
          test "$(lipo -archs build/Neylu.app/Contents/MacOS/Neylu)" = arm64
      - name: Archive CI build
        run: ditto -c -k --keepParent --norsrc build/Neylu.app build/Neylu-CI-arm64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Neylu-CI-arm64
          path: build/Neylu-CI-arm64.zip
          if-no-files-found: error
          retention-days: 7
