name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.1.0-alpha.1'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          channel="$(python3 scripts/release.py validate --tag "$RELEASE_TAG")"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          git show-ref --verify "refs/tags/$RELEASE_TAG"
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: release
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Test and build on native architecture
        run: |
          python3 -m unittest discover -s Tests -p 'test_*.py' -v
          ./test-history.sh
          ./build.sh
          ./test-updates.sh
          ./test-runtime.sh
      - name: Sign and notarize stable app
        if: needs.prepare.outputs.channel == 'stable'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/sign-and-notarize.sh "$PWD/build/Neylu.app"
      - name: Create DMG with Applications shortcut
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: python3 scripts/release.py package --tag "$RELEASE_TAG" --arch "$RELEASE_ARCH" --app build/Neylu.app --output dist
      - name: Sign and notarize stable installer
        if: needs.prepare.outputs.channel == 'stable'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for image in dist/*.dmg; do scripts/sign-and-notarize.sh "$PWD/$image"; done
      - name: Verify final installer
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          python3 scripts/release.py verify-assets --tag "$RELEASE_TAG" --arch "$RELEASE_ARCH" --output dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - name: Verify and publish immutable installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          python3 scripts/release.py verify-assets --tag "$RELEASE_TAG" --output dist
          mkdir -p .build
          python3 scripts/release.py notes --tag "$RELEASE_TAG" --file .build/release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p .build/published
            gh release download "$RELEASE_TAG" --dir .build/published
            python3 scripts/release.py verify-assets --tag "$RELEASE_TAG" --output .build/published
            # Reuse actual published installers on reruns; never replace published assets.
            cp .build/published/* dist/
          else
            flags=()
            if [ "$CHANNEL" = preview ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --title "Neylu $RELEASE_TAG" \
              --notes-file .build/release-notes.md "${flags[@]}" dist/*.dmg
          fi
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > .build/published-release.json
          python3 scripts/release.py verify-github-assets --tag "$RELEASE_TAG" --output dist \
            --metadata .build/published-release.json
  homebrew:
    name: Update Homebrew tap
    needs: [prepare, publish]
    permissions:
      contents: read
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
